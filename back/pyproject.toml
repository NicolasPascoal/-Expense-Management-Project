# e pyflakes (F — import/variável não usada, nome indefinido, etc.), sem estilo
# (linha longa, aspas, etc.). O projeto nunca foi lintado antes; regras de
# estilo completas (E/W) ficam para quando alguém decidir adotar isso de
# propósito, não como efeito colateral de configurar CI.
select = ["E9", "F"]
